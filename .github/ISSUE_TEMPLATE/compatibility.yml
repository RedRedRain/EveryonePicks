name: Mod compatibility
description: Another mod's card doesn't work right with this
labels: ["compatibility"]
body:
  - type: input
    id: mod
    attributes:
      label: Which mod and which card
      placeholder: "WillsWackyManagers - Reroll"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What it does wrong
      description: Does it work for the person who picked it but not for everyone else?
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log
      description: "`BepInEx\LogOutput.log` from whoever picked the card."
    validations:
      required: false
