name: Mod compatibility
description: Another mod's card or feature misbehaves with EveryonePicks
labels: ["compatibility"]
body:
  - type: input
    id: mod
    attributes:
      label: Which mod, and which card or feature?
      placeholder: "WillsWackyManagers - Reroll"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What it does wrong
      description: >
        Especially useful: does it work correctly for the person who picked it but not for
        everyone else, or is it wrong for everybody?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: EveryonePicks version
      placeholder: "0.3.34"
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log
      description: >
        `BepInEx\LogOutput.log` from the player who picked the card. It is overwritten on every
        launch, so copy it out before restarting.
    validations:
      required: false
