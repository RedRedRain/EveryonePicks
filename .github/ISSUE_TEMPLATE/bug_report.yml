name: Bug report
description: Something broke in a match
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Mod version
      placeholder: "0.3.36"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true

  - type: dropdown
    id: who
    attributes:
      label: Did it affect one player or everyone?
      options:
        - One player
        - Everyone
        - Not sure
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log
      description: >
        `BepInEx\LogOutput.log`, from whoever it happened to. It gets wiped on every launch, so
        grab it before restarting.
    validations:
      required: false

  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: A list or a screenshot of your mod manager.
    validations:
      required: false
